<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 · Registro de usuario</title>
  <link rel="stylesheet" href="ejercicio-1-registro.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">REGISTRO</span>
          <h1>Crea tu cuenta</h1>
          <p>
            Completa tus datos para registrarte. Los campos marcados con
            <strong>*</strong> son obligatorios.
          </p>
        </header>

        <form class="contact-form" action="#" method="post">
          <section class="form-block">
            <h2>Datos personales</h2>
            <div class="form-field">
              <label for="nombre">
                Nombre completo
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input
                type="text"
                id="nombre"
                name="nombre"
                autocomplete="name"
                placeholder="Laura Martínez"
                required
              >
            </div>

            <div class="form-field">
              <label for="email">
                Correo electrónico
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="nombre@empresa.com"
                required
              >
            </div>
          </section>

          <section class="form-block">
            <h2>Seguridad</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="password">
                  Contraseña
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  minlength="8"
                  autocomplete="new-password"
                  aria-describedby="password-help"
                  required
                >
                <small id="password-help" class="field-help">
                  Debe contener al menos 8 caracteres.
                </small>
              </div>

              <div class="form-field">
                <label for="password-confirm">
                  Confirmar contraseña
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="password"
                  id="password-confirm"
                  name="password-confirm"
                  minlength="8"
                  autocomplete="new-password"
                  required
                >
              </div>
            </div>
          </section>

          <label class="choice">
            <input type="checkbox" name="terminos" required>
            <span>
              Acepto los términos y condiciones y la política de privacidad.
            </span>
          </label>

          <div class="form-actions">
            <button type="submit" class="button button-primary">
              Crear cuenta
            </button>
            <button type="reset" class="button button-secondary">
              Limpiar
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
