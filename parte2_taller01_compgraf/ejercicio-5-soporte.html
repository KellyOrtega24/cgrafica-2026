<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 · Soporte técnico</title>
  <link rel="stylesheet" href="ejercicio-5-soporte.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">SOPORTE</span>
          <h1>Solicitud de soporte técnico</h1>
          <p>
            Describe tu problema y nuestro equipo te contactará pronto.
          </p>
        </header>

        <form class="contact-form" action="#" method="post">
          <section class="form-block">
            <h2>Datos de contacto</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="nombre">
                  Nombre
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  autocomplete="name"
                  required
                >
              </div>
              <div class="form-field">
                <label for="email">
                  Correo
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                >
              </div>
            </div>
          </section>

          <section class="form-block">
            <h2>Detalles del ticket</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="categoria">
                  Categoría
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <select id="categoria" name="categoria" required>
                  <option value="" selected disabled>Seleccione una categoría</option>
                  <option value="hardware">Hardware</option>
                  <option value="software">Software</option>
                  <option value="redes">Redes</option>
                  <option value="otro">Otro</option>
                </select>
              </div>
              <div class="form-field">
                <label for="prioridad">
                  Prioridad
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <select id="prioridad" name="prioridad" required>
                  <option value="" selected disabled>Seleccione una prioridad</option>
                  <option value="baja">Baja</option>
                  <option value="media">Media</option>
                  <option value="alta">Alta</option>
                  <option value="urgente">Urgente</option>
                </select>
              </div>
            </div>
          </section>

          <div class="form-field">
            <label for="descripcion">
              Descripción del problema
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <textarea
              id="descripcion"
              name="descripcion"
              rows="7"
              maxlength="1200"
              placeholder="Describe con el mayor detalle posible qué está ocurriendo..."
              required
            ></textarea>
            <small class="field-help">Máximo 1200 caracteres.</small>
          </div>

          <div class="form-field">
            <label for="captura">Adjuntar captura de pantalla (opcional)</label>
            <input
              type="file"
              id="captura"
              name="captura"
              accept="image/*"
            >
            <small class="field-help">Formatos de imagen: JPG, PNG.</small>
          </div>

          <div class="form-actions">
            <button type="submit" class="button button-primary">
              Enviar ticket
            </button>
            <button type="reset" class="button button-secondary">
              Limpiar
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
