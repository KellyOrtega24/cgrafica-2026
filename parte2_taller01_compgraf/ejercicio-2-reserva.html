<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 · Reserva</title>
  <link rel="stylesheet" href="ejercicio-2-reserva.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">RESERVAS</span>
          <h1>Reserva tu mesa</h1>
          <p>
            Cuéntanos cuándo quieres visitarnos y cuántas personas te acompañan.
          </p>
        </header>

        <form class="contact-form" action="#" method="post">
          <section class="form-block">
            <h2>Datos de contacto</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="nombre">
                  Nombre
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  autocomplete="name"
                  placeholder="Tu nombre"
                  required
                >
              </div>
              <div class="form-field">
                <label for="telefono">Teléfono</label>
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  autocomplete="tel"
                  placeholder="+57 300 000 0000"
                >
              </div>
            </div>
          </section>

          <section class="form-block">
            <h2>Detalles de la reserva</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="fecha">
                  Fecha
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input type="date" id="fecha" name="fecha" required>
              </div>
              <div class="form-field">
                <label for="hora">
                  Hora
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input type="time" id="hora" name="hora" required>
              </div>
            </div>

            <div class="form-field">
              <label for="personas">
                Número de personas
                <span class="required-mark" aria-hidden="true">*</span>
              </label>
              <input
                type="number"
                id="personas"
                name="personas"
                min="1"
                max="20"
                step="1"
                value="2"
                required
              >
            </div>
          </section>

          <div class="form-field">
            <label for="comentarios">Comentarios adicionales</label>
            <textarea
              id="comentarios"
              name="comentarios"
              rows="5"
              maxlength="500"
              placeholder="Alergias, ocasión especial, preferencias de mesa..."
            ></textarea>
            <small class="field-help">Máximo 500 caracteres.</small>
          </div>

          <div class="form-actions">
            <button type="submit" class="button button-primary">
              Confirmar reserva
            </button>
            <button type="reset" class="button button-secondary">
              Limpiar
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
