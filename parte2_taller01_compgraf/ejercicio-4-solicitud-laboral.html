<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 · Solicitud laboral</title>
  <link rel="stylesheet" href="ejercicio-4-solicitud-laboral.css">
</head>
<body>
  <main class="form-page">
    <section class="form-section">
      <div class="form-container">
        <header class="form-header">
          <span class="eyebrow">TRABAJA CON NOSOTROS</span>
          <h1>Postúlate a una vacante</h1>
          <p>
            Completa tus datos y adjunta tu hoja de vida. Los campos marcados con
            <strong>*</strong> son obligatorios.
          </p>
        </header>

        <form class="contact-form" action="#" method="post">
          <section class="form-block">
            <h2>Datos personales</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="nombre">
                  Nombre
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  autocomplete="given-name"
                  required
                >
              </div>
              <div class="form-field">
                <label for="apellido">
                  Apellido
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="text"
                  id="apellido"
                  name="apellido"
                  autocomplete="family-name"
                  required
                >
              </div>
            </div>
            <div class="form-grid">
              <div class="form-field">
                <label for="email">
                  Correo
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                >
              </div>
              <div class="form-field">
                <label for="telefono">Teléfono</label>
                <input
                  type="tel"
                  id="telefono"
                  name="telefono"
                  autocomplete="tel"
                >
              </div>
            </div>
          </section>

          <section class="form-block">
            <h2>Información laboral</h2>
            <div class="form-grid">
              <div class="form-field">
                <label for="puesto">
                  Puesto de interés
                  <span class="required-mark" aria-hidden="true">*</span>
                </label>
                <select id="puesto" name="puesto" required>
                  <option value="" selected disabled>Seleccione un puesto</option>
                  <option value="desarrollo">Desarrollo de software</option>
                  <option value="diseno">Diseño UX/UI</option>
                  <option value="datos">Análisis de datos</option>
                  <option value="soporte">Soporte técnico</option>
                </select>
              </div>
              <div class="form-field">
                <label for="experiencia">Años de experiencia</label>
                <input
                  type="number"
                  id="experiencia"
                  name="experiencia"
                  min="0"
                  max="50"
                  step="1"
                >
              </div>
            </div>
          </section>

          <div class="form-field">
            <label for="cv">
              Hoja de vida (CV)
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="file"
              id="cv"
              name="cv"
              accept=".pdf,.doc,.docx"
              required
            >
            <small class="field-help">Formatos aceptados: PDF o Word.</small>
          </div>

          <div class="form-field">
            <label for="carta">Carta de presentación (opcional)</label>
            <textarea
              id="carta"
              name="carta"
              rows="6"
              maxlength="1000"
              placeholder="Cuéntanos por qué te interesa esta vacante..."
            ></textarea>
          </div>

          <label class="choice">
            <input type="checkbox" name="terminos" required>
            <span>
              Autorizo el tratamiento de mis datos personales para procesos de selección.
            </span>
          </label>

          <div class="form-actions">
            <button type="submit" class="button button-primary">
              Enviar postulación
            </button>
            <button type="reset" class="button button-secondary">
              Limpiar
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
